# Compilacion automatica para Windows — OBS Capas Wirecast
#
# Que hace:
#  - Cada vez que subes cambios a main, compila el plugin para Windows x64
#    con la plantilla oficial de OBS (Visual Studio 2022 + CMake).
#  - Guarda el ZIP resultante como "Artifact" para descargarlo.
#  - Si creas un tag como v1.0.0, crea ademas un Release en GitHub
#    con ese ZIP adjunto, listo para instalar en OBS.
#
# No necesitas instalar nada en tu PC para compilar. Solo GitHub.
# El DLL se compila contra OBS 30.2.3, la version que usa Santiago.
# buildspec.json esta fijado a OBS 30.2.3, obs-deps 2024-05-08
# y Qt6 2024-05-08, con los hashes oficiales de obs-studio 30.2.3.
# No hay que actualizar OBS.

name: Compilar para Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compilar plugin
        shell: pwsh
        run: |
          .github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Empaquetar ZIP
        shell: pwsh
        run: |
          .github/scripts/Package-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Ver que se genero
        shell: pwsh
        run: |
          Get-ChildItem -Recurse release | Select-Object FullName, Length

      - name: Subir ZIP como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-capas-wirecast-windows-x64
          path: release/*.zip
          if-no-files-found: error
          retention-days: 90

      - name: Adjuntar ZIP al Release (solo si es un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          draft: false
          prerelease: false
